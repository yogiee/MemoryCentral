<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>MemoryCentral</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app">

  <!-- BRAND CORNER -->
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect class="core" x="9" y="9" width="6" height="6"/>
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
          <line x1="2" y1="2" x2="7" y2="7"/>
          <line x1="22" y1="2" x2="17" y2="7"/>
          <line x1="2" y1="22" x2="7" y2="17"/>
          <line x1="22" y1="22" x2="17" y2="17"/>
        </g>
      </svg>
    </span>
  </div>

  <!-- TOOLBAR -->
  <header class="toolbar">
    <span class="brand-name">MemoryCentral</span>
    <span class="brand-host" id="host-pill">localhost:9980</span>

    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search memories across all projects…" autocomplete="off">
      <kbd>⌘K</kbd>
    </label>

    <div class="toolbar-status" id="sync-status" title="Last sync via Stop hook">
      <span class="dot"></span>
      <span id="sync-label">—</span>
    </div>

    <div class="theme-toggle" role="radiogroup" aria-label="Theme">
      <button data-theme-set="light" title="Light" aria-pressed="false" aria-label="Light theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="3" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21"/>
          <line x1="3" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21" y2="12"/>
          <line x1="5.6" y1="5.6" x2="7" y2="7"/><line x1="17" y1="17" x2="18.4" y2="18.4"/>
          <line x1="5.6" y1="18.4" x2="7" y2="17"/><line x1="17" y1="7" x2="18.4" y2="5.6"/>
        </svg>
      </button>
      <button data-theme-set="system" title="System" aria-pressed="true" aria-label="System theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="13" rx="1"/>
          <line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
      <button data-theme-set="dark" title="Dark" aria-pressed="false" aria-label="Dark theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- LEFT RAIL -->
  <nav class="rail" aria-label="Primary">
    <button data-view="overview" aria-current="true" title="Overview">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="5"/>
        <rect x="13" y="10" width="8" height="11"/><rect x="3" y="13" width="8" height="8"/>
      </svg>
    </button>
    <button data-view="recent" title="Recent activity">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>
      </svg>
    </button>
    <div class="rail-spacer"></div>
    <button id="rail-sync" title="Sync now">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/>
        <path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/>
        <polyline points="21 4 21 8 17 8"/><polyline points="3 20 3 16 7 16"/>
      </svg>
    </button>
  </nav>

  <!-- CONTENT GRID -->
  <div id="content" class="content no-selection">

    <!-- COL 1: PROJECTS -->
    <section class="col col-projects">
      <div class="col-header">
        <h2>Projects</h2>
        <span class="meta" id="projects-meta"></span>
      </div>
      <div class="col-body" id="projects-body">
        <div class="empty-state">Loading…</div>
      </div>
    </section>

    <!-- COL 2: dynamic -->
    <section class="col col-memories" id="col-memories"></section>

    <!-- COL 3: memory detail -->
    <section class="col col-detail" id="col-detail"></section>

  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
