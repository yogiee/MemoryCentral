<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Brand preview</title>
<style>
body { font-family: system-ui, sans-serif; padding: 40px; background: #faf6ef; color: #222; max-width: 1000px; margin: 0 auto; }
section { margin-bottom: 48px; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: #777; margin: 0 0 16px; font-weight: 600; }
.box { padding: 32px; background: #fff; border: 1px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.box.dark { background: #141a25; }
.box.row { display: flex; gap: 32px; flex-wrap: wrap; }
img { display: block; max-width: 100%; }
.row img { height: 64px; width: auto; }
.dark { color: white; }
</style>
</head>
<body>
<section>
  <h2>mark.svg @ 64</h2>
  <div class="box row">
    <img src="mark.svg" style="height: 64px; width: 64px;">
    <img src="mark.svg" style="height: 32px; width: 32px;">
    <img src="mark.svg" style="height: 16px; width: 16px;">
  </div>
</section>

<section>
  <h2>mark.svg on dark @ 64</h2>
  <div class="box dark row">
    <img src="mark.svg" style="height: 64px; width: 64px;">
    <img src="mark.svg" style="height: 32px; width: 32px;">
    <img src="mark.svg" style="height: 16px; width: 16px;">
  </div>
</section>

<section>
  <h2>mark-live.svg @ 96</h2>
  <div class="box">
    <img src="mark-live.svg" style="height: 96px; width: 96px;">
  </div>
</section>

<section>
  <h2>wordmark.svg @ 60</h2>
  <div class="box">
    <img src="wordmark.svg" style="height: 60px; width: auto;">
  </div>
</section>

<section>
  <h2>wordmark.svg on dark @ 60</h2>
  <div class="box dark">
    <img src="wordmark.svg" style="height: 60px; width: auto;">
  </div>
</section>

<section>
  <h2>lockup-horizontal.svg @ 60</h2>
  <div class="box">
    <img src="lockup-horizontal.svg" style="height: 60px; width: auto;">
  </div>
</section>

<section>
  <h2>lockup-horizontal.svg on dark @ 60</h2>
  <div class="box dark">
    <img src="lockup-horizontal.svg" style="height: 60px; width: auto;">
  </div>
</section>

<section>
  <h2>lockup-stacked.svg @ 160</h2>
  <div class="box">
    <img src="lockup-stacked.svg" style="height: 160px; width: auto;">
  </div>
</section>

<section>
  <h2>lockup-stacked.svg on dark @ 160</h2>
  <div class="box dark">
    <img src="lockup-stacked.svg" style="height: 160px; width: auto;">
  </div>
</section>

</body>
</html>
